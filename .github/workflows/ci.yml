name: Tests

on:
  push:
    branches: [main, rebuild]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installeer dependencies
        run: npm ci

      - name: Installeer Playwright-browser
        run: npx playwright install --with-deps chromium

      - name: Sprite en sw.js zijn actueel
        run: node tools/build-icons.mjs && node tools/build-sw.mjs --check && git diff --exit-code -- assets/icons/sprite.svg js/data/icon-credits.js

      - name: Playwright-tests
        run: npm test

      - name: Upload screenshots en rapport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testresultaat
          path: |
            tests/screenshots/
            test-results/
          retention-days: 7
