name: Testen en publiceren

# Elke push draait twee dingen naast elkaar:
#   rook  eerst de controle op privégegevens (blocklist), dan de korte rooktest (laden, geen fouten,
#         kernfuncties; telefoon en tablet; doel: onder 10 minuten)
#   test  de volledige suite (vier formaten, ongeveer een uur op de runner van GitHub)
#
# Test-repo (the-flush-factor-test), branch main: is de ROOKTEST groen, dan gaat de testversie meteen naar
#   https://jmldewaal-sedillo.github.io/the-flush-factor-test/   (noindex; Apps/CLAUDE.md sectie 11)
#   De volledige suite draait door en blokkeert de publicatie niet; faalt hij, dan zie je dat aan deze run.
# Live-repo (the-flush-factor): deze workflow publiceert daar NIET. Het live adres wordt door GitHub Pages
#   rechtstreeks vanaf branch main gevuld. main blijft achter de volledige suite: mergen naar main alleen na
#   akkoord van Jenn en alleen als de job "test" groen is op de commit die gemerged wordt.
# De controle op privégegevens draait ook bij pushes met alleen documentatie: zie privacy.yml.
# Zie README.md ("Testen en publiceren") en docs/testversie.md.

on:
  push:
    paths-ignore: ['**.md']      # alleen documentatie gewijzigd: geen testrun
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rook:
    name: Rooktest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Vangnet: geen privégegevens (huisadres) online (Apps/CLAUDE.md sectie 11, punt 6). De lijst komt uit het
      # geheim PRIVATE_BLOCKLIST en wordt nooit getoond. Ontbreekt het geheim in een van onze eigen repo's, dan
      # faalt de run: zonder lijst controleert deze stap niets. (Bij een pull request vanuit een fork zijn er
      # geen geheimen; daar blijft het bij een waarschuwing.)
      - name: Controle op privégegevens
        env:
          PRIVATE_BLOCKLIST: ${{ secrets.PRIVATE_BLOCKLIST }}
        run: |
          if [ -z "$PRIVATE_BLOCKLIST" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Het geheim PRIVATE_BLOCKLIST ontbreekt in deze repo. Zet het met Apps/tools/sync-blocklist.sh (zie docs/testversie.md)."
            exit 1
          fi
          python3 tests/no-private-data.py --ci

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installeer dependencies
        run: npm ci

      - name: Installeer Playwright-browser
        run: npx playwright install --with-deps chromium

      - name: Sprite en sw.js zijn actueel
        run: node tools/build-icons.mjs && node tools/build-sw.mjs --check && git diff --exit-code -- assets/icons/sprite.svg js/data/icon-credits.js

      - name: Rooktest (telefoon en tablet)
        run: npm run test:rook

      - name: Upload rapport bij een fout
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rooktest
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: Volledige suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Een nieuwe push vervangt de lopende volledige run van dezelfde branch; anders staan ze een uur in de rij.
    concurrency:
      group: volledig-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installeer dependencies
        run: npm ci

      - name: Installeer Playwright-browser
        run: npx playwright install --with-deps chromium

      - name: Playwright-tests
        run: npm test

      - name: Upload screenshots en rapport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testresultaat
          path: |
            tests/screenshots/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Publiceren op het testadres
    needs: rook
    # Alleen de test-repo, alleen main, alleen als de rooktest groen is. Wacht niet op de volledige suite.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && endsWith(github.event.repository.name, '-test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testversie klaarzetten (noindex)
        run: node tools/bouw-site.mjs _site "${{ github.event.repository.name }}" "$GITHUB_SHA"

      # Ook wat er echt online komt nog een keer langs de lijst, vóór het publiceren.
      - name: Controle op privégegevens in de testversie
        env:
          PRIVATE_BLOCKLIST: ${{ secrets.PRIVATE_BLOCKLIST }}
        run: |
          [ -n "$PRIVATE_BLOCKLIST" ] || { echo "::error::Het geheim PRIVATE_BLOCKLIST ontbreekt; er wordt niet gepubliceerd."; exit 1; }
          python3 tools/no-private-data.py --dir _site

      # Zelf inpakken in plaats van actions/upload-pages-artifact: die laat bestanden die met een
      # punt beginnen weg (.nojekyll).
      - name: Inpakken
        run: tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" .

      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Adres in de samenvatting
        run: echo "Gepubliceerd op ${{ steps.deployment.outputs.page_url }} (${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
