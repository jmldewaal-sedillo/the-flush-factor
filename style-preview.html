<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Flush Factor — stijlvoorbeelden</title>
<!--
  Stijlvoorbeeldpagina (ROADMAP punt 78). Drie richtingen naast elkaar; hoort niet bij het spel zelf.
  Elke richting is een set CSS-variabelen (tokens). De gekozen set wordt het designbestand van het spel.
  Lettertypen: SIL Open Font License, lokaal in assets/fonts/ (zie CREDITS.md).
-->
<style>
@font-face { font-family: 'Lilita One'; src: url('assets/fonts/lilita-one/lilita-one-400.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Nunito'; font-weight: 600; src: url('assets/fonts/nunito/nunito-600.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Nunito'; font-weight: 800; src: url('assets/fonts/nunito/nunito-800.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Bungee'; src: url('assets/fonts/bungee/bungee-400.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Rubik'; font-weight: 500; src: url('assets/fonts/rubik/rubik-500.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Rubik'; font-weight: 800; src: url('assets/fonts/rubik/rubik-800.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Bangers'; src: url('assets/fonts/bangers/bangers-400.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Comic Neue'; font-weight: 700; src: url('assets/fonts/comic-neue/comic-neue-700.woff2') format('woff2'); font-display: swap; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #2b2b33; color: #fff; font-family: system-ui, sans-serif; padding: 20px 16px 60px; }
.page-title { font-size: 1.3rem; margin-bottom: 4px; }
.page-intro { font-size: 0.9rem; opacity: 0.8; max-width: 760px; line-height: 1.5; margin-bottom: 20px; }
.directions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
@media (max-width: 1100px) { .directions { grid-template-columns: 1fr; max-width: 460px; margin-inline: auto; } }
.ic { display: inline-block; flex-shrink: 0; vertical-align: middle; }
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

/* ══════════ TOKENS PER RICHTING ══════════ */

/* A — STICKER: dikke omlijning, harde schaduw, scheve hoekjes, badeend-geel en ontstopper-rood */
.t-sticker {
  --ink: #1d1b3a; --paper: #fff8e7; --scene: #9fe6d0; --scene-line: rgba(29, 27, 58, 0.10);
  --primary: #ffd23f; --on-primary: #1d1b3a; --danger: #ef3e36; --ok: #2bb673; --accent: #3d9be9; --panel: #fff8e7; --on-panel: #1d1b3a; --muted: #6b6788;
  --hud: #3d9be9; --on-hud: #ffffff;
  --font-display: 'Lilita One', system-ui, sans-serif; --font-body: 'Nunito', system-ui, sans-serif; --display-spacing: 0.01em; --display-case: none;
  --border: 3px solid var(--ink); --radius: 18px; --radius-btn: 999px;
  --shadow: 4px 4px 0 var(--ink); --shadow-press: 1px 1px 0 var(--ink);
  --tilt: -1.5deg; --tilt-alt: 1.2deg;
  --scene-bg: linear-gradient(var(--scene-line) 2px, transparent 2px) 0 0 / 34px 34px, linear-gradient(90deg, var(--scene-line) 2px, transparent 2px) 0 0 / 34px 34px, var(--scene);
}

/* B — TEGELWERK: Delfts blauw op witte tegels, emaille bordjes, strak en vierkant */
.t-tegel {
  --ink: #16306e; --paper: #f7f5ee; --scene: #f7f5ee; --scene-line: #c9d3e6;
  --primary: #f2b705; --on-primary: #16306e; --danger: #c8452c; --ok: #2f8f6b; --accent: #1f4fa8; --panel: #ffffff; --on-panel: #16306e; --muted: #5d6b8c;
  --hud: #1f4fa8; --on-hud: #ffffff;
  --font-display: 'Bungee', system-ui, sans-serif; --font-body: 'Rubik', system-ui, sans-serif; --display-spacing: 0.02em; --display-case: uppercase;
  --border: 2px solid var(--ink); --radius: 6px; --radius-btn: 8px;
  --shadow: 0 3px 0 var(--ink), inset 0 0 0 3px #fff, inset 0 0 0 4px rgba(22, 48, 110, 0.35); --shadow-press: 0 1px 0 var(--ink), inset 0 0 0 3px #fff, inset 0 0 0 4px rgba(22, 48, 110, 0.35);
  --tilt: 0deg; --tilt-alt: 0deg;
  --scene-bg: radial-gradient(circle at 50% 50%, rgba(31, 79, 168, 0.20) 0 5px, transparent 6px) 0 0 / 44px 44px, linear-gradient(var(--scene-line) 2px, transparent 2px) 0 0 / 44px 44px, linear-gradient(90deg, var(--scene-line) 2px, transparent 2px) 0 0 / 44px 44px, var(--scene);
}

/* C — STRIPBOEK: zwarte inkt, rasterpunten, tekstballonnen, knalkleuren */
.t-strip {
  --ink: #111111; --paper: #fffdf2; --scene: #29b6f6; --scene-line: rgba(0, 0, 0, 0.16);
  --primary: #ffe14d; --on-primary: #111111; --danger: #ff3d5a; --ok: #19c37d; --accent: #ff3d5a; --panel: #fffdf2; --on-panel: #111111; --muted: #55524a;
  --hud: #fffdf2; --on-hud: #111111;
  --font-display: 'Bangers', system-ui, sans-serif; --font-body: 'Comic Neue', system-ui, sans-serif; --display-spacing: 0.05em; --display-case: uppercase;
  --border: 3px solid var(--ink); --radius: 4px; --radius-btn: 4px;
  --shadow: 6px 6px 0 var(--ink); --shadow-press: 2px 2px 0 var(--ink);
  --tilt: -2.5deg; --tilt-alt: 2deg;
  --scene-bg: radial-gradient(circle, var(--scene-line) 0 2.2px, transparent 2.6px) 0 0 / 11px 11px, var(--scene);
}

/* ══════════ GEDEELDE ONDERDELEN (gebruiken alleen de tokens) ══════════ */
.direction { background: var(--paper); color: var(--on-panel); border-radius: 14px; overflow: hidden; font-family: var(--font-body); font-weight: 600; }
.t-tegel .direction-body, .t-tegel { font-weight: 500; }
.t-strip { font-weight: 700; }
.direction-head { padding: 16px 16px 12px; border-bottom: var(--border); }
.direction-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; letter-spacing: var(--display-spacing); text-transform: var(--display-case); line-height: 1.05; }
.direction-head p { font-size: 0.86rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.block { padding: 14px 16px; border-bottom: 1px dashed rgba(0, 0, 0, 0.18); }
.block > h3 { font-family: system-ui, sans-serif; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: var(--display-spacing); text-transform: var(--display-case); }

.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border: var(--border); border-radius: calc(var(--radius) / 2); }
.type-display { font-size: 1.7rem; line-height: 1.1; }
.type-body { font-size: 0.95rem; margin-top: 6px; line-height: 1.45; }
.type-name { font-family: system-ui, sans-serif; font-size: 0.7rem; color: var(--muted); margin-top: 6px; font-weight: 400; }

/* stukje "scène" waar de knoppen overheen zweven */
.scene { background: var(--scene-bg); border: var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.scene.column { flex-direction: column; align-items: stretch; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 22px; background: var(--primary); color: var(--on-primary); border: var(--border); border-radius: var(--radius-btn); box-shadow: var(--shadow); font-family: var(--font-display); font-size: 1.15rem; letter-spacing: var(--display-spacing); text-transform: var(--display-case); transform: rotate(var(--tilt)); transition: transform 0.08s, box-shadow 0.08s; }
.btn:active { box-shadow: var(--shadow-press); transform: rotate(var(--tilt)) translate(3px, 3px); }
.btn.round { width: 54px; height: 54px; padding: 0; border-radius: 50%; transform: rotate(var(--tilt-alt)); }
.btn.shop { background: var(--accent); color: #fff; }
.btn.danger { background: var(--danger); color: #fff; }
.t-tegel .btn.round { border-radius: var(--radius-btn); }
.t-strip .btn.round { border-radius: 50%; }

.score { display: inline-flex; flex-direction: column; align-items: center; background: var(--hud); color: var(--on-hud); border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px 16px 10px; transform: rotate(var(--tilt-alt)); }
.score-top { display: inline-flex; align-items: center; gap: 8px; }
.score-top b { font-family: var(--font-display); font-weight: 400; font-size: 2rem; line-height: 1; letter-spacing: var(--display-spacing); }
.score small { font-size: 0.72rem; opacity: 0.9; }
.pills { display: flex; gap: 5px; margin-top: 5px; }
.pill { display: inline-flex; align-items: center; gap: 3px; font-size: 0.68rem; font-weight: 800; padding: 3px 7px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: var(--radius-btn); }
/* stripboek: de scorebubbel is een tekstballon */
.t-strip .score { border-radius: 26px; position: relative; }
.t-strip .score::after { content: ''; position: absolute; left: 22px; bottom: -14px; width: 20px; height: 20px; background: var(--hud); border-right: var(--border); border-bottom: var(--border); transform: rotate(45deg) skew(12deg, 12deg); }

.tool { position: relative; width: 60px; height: 60px; display: inline-flex; align-items: center; justify-content: center; background: var(--paper); color: var(--ink); border: var(--border); border-radius: 50%; box-shadow: var(--shadow); }
.t-tegel .tool { border-radius: var(--radius-btn); }
.tool.working { background: #d8f5e6; }
.tool.chaos { background: #ffe1df; }
.tool.cooling { filter: saturate(0.4); }
.tool .ring { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); transform: rotate(-90deg); }
.tool .ring circle { fill: none; stroke-width: 5; }
.tool .ring .track { stroke: rgba(0, 0, 0, 0.12); }
.tool .ring .fill { stroke: var(--danger); stroke-linecap: round; stroke-dasharray: 201; stroke-dashoffset: 70; }
.tool .secs { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); font-size: 0.72rem; font-weight: 800; background: var(--ink); color: #fff; padding: 1px 7px; border-radius: 999px; }
.tool .badge { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; color: #fff; }
.tool.working .badge { background: var(--ok); }
.tool.chaos .badge { background: var(--danger); }
.tool.unknown .badge { background: var(--paper); color: var(--ink); font-family: var(--font-display); font-size: 0.9rem; }
.tool-label { font-family: system-ui, sans-serif; font-size: 0.62rem; font-weight: 400; color: var(--ink); text-align: center; margin-top: 18px; opacity: 0.75; }
.tool-wrap { display: flex; flex-direction: column; align-items: center; }

.flush { width: 84px; height: 84px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: #fff; border: var(--border); box-shadow: var(--shadow); }
.t-sticker .flush { background: var(--danger); border-width: 4px; }
.t-tegel .flush { border-radius: 50%; background: var(--hud); }
.t-strip .flush { background: var(--primary); color: var(--ink); clip-path: none; }

.card { width: 168px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; background: var(--panel); color: var(--on-panel); border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 10px 12px; position: relative; transform: rotate(var(--tilt-alt)); }
.card .icon { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--primary); color: var(--ink); border: var(--border); margin-bottom: 4px; }
.t-tegel .card .icon { border-radius: var(--radius-btn); background: #e7eefb; }
.card .name { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; letter-spacing: var(--display-spacing); text-transform: var(--display-case); line-height: 1.1; }
.t-tegel .card .name { font-size: 0.86rem; }
.card .detail { font-size: 0.78rem; font-weight: 800; color: var(--accent); }
.card .desc { font-size: 0.74rem; color: var(--muted); line-height: 1.3; }
.card .price { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; padding: 4px 12px; background: var(--ink); color: #fff; border-radius: var(--radius-btn); font-weight: 800; font-size: 0.9rem; }
.card .tag { position: absolute; top: -12px; right: -10px; padding: 3px 10px; background: var(--danger); color: #fff; border: var(--border); border-radius: var(--radius-btn); font-family: var(--font-display); font-weight: 400; font-size: 0.82rem; letter-spacing: var(--display-spacing); text-transform: var(--display-case); transform: rotate(8deg); }
.t-tegel .card .tag { transform: none; top: -10px; right: 8px; }
/* stripboek: het label is een knal-ster */
.t-strip .card .tag { background: var(--primary); color: var(--ink); padding: 8px 12px; border: none; clip-path: polygon(50% 0, 61% 18%, 82% 8%, 80% 30%, 100% 36%, 84% 52%, 96% 72%, 74% 72%, 70% 96%, 52% 80%, 34% 98%, 30% 74%, 6% 78%, 18% 56%, 0 40%, 22% 32%, 16% 10%, 40% 20%); top: -22px; right: -22px; width: 78px; height: 70px; display: flex; align-items: center; justify-content: center; }
.card.owned { background: #e9f7ef; }
.card.owned .price { background: var(--ok); }

.welcome { background: var(--panel); color: var(--on-panel); border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 16px 16px; }
.welcome h4 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; letter-spacing: var(--display-spacing); text-transform: var(--display-case); line-height: 1.1; transform: rotate(var(--tilt)); transform-origin: left; }
.t-tegel .welcome h4 { font-size: 1.15rem; }
.welcome p { font-size: 0.84rem; color: var(--muted); margin: 8px 0 12px; line-height: 1.4; }
.identity { display: flex; gap: 10px; align-items: center; }
.avatar-big { width: 58px; height: 58px; flex-shrink: 0; border-radius: 50%; background: var(--primary); color: var(--ink); border: var(--border); display: flex; align-items: center; justify-content: center; }
.field { flex: 1; height: 46px; padding: 0 12px; background: #fff; border: var(--border); border-radius: calc(var(--radius) / 1.5); display: flex; align-items: center; font-weight: 800; color: var(--muted); }
.avatars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 12px 0; }
.avatars span { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #fff; border: 2px solid var(--ink); border-radius: calc(var(--radius) / 2); }
.avatars span.on { background: var(--primary); box-shadow: 2px 2px 0 var(--ink); }
.welcome .btn { width: 100%; }
.or { font-family: system-ui, sans-serif; font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; }
.auth { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 8px 0 14px; margin-top: 8px; background: #fff; color: var(--muted); border: 2px dashed var(--muted); border-radius: var(--radius-btn); font-weight: 800; font-size: 0.9rem; }
.auth .soon { padding: 3px 10px; background: var(--ink); color: #fff; border-radius: var(--radius-btn); font-size: 0.7rem; }

.message { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--danger); color: #fff; border: var(--border); border-radius: var(--radius-btn); box-shadow: var(--shadow); font-family: var(--font-display); font-size: 1.1rem; letter-spacing: var(--display-spacing); text-transform: var(--display-case); transform: rotate(var(--tilt)); }
.message.good { background: var(--ok); }
</style>
</head>
<body>

<h1 class="page-title">The Flush Factor — drie stijlrichtingen</h1>
<p class="page-intro">Zelfde onderdelen, drie keer anders: kleurpalet, lettertype, knoppen, scorebubbel, gereedschap, winkelkaart en welkomstscherm. Kies één richting (of noem wat je uit een andere wilt lenen); daarna wordt die stijl overal in het spel doorgevoerd.</p>

<div class="directions" id="directions"></div>

<script>
const I = (name, size) => `<svg class="ic" width="${size}" height="${size}" aria-hidden="true"><use href="assets/icons/sprite.svg#${name}"/></svg>`;

const DIRECTIONS = [
  { cls: 't-sticker', letter: 'A', name: 'Sticker', display: 'Lilita One', body: 'Nunito',
    blurb: 'Dikke omlijning, harde schaduw, alles een tikje scheef. Voelt als een vel stickers op de wc-deur: brutaal en vrolijk.',
    colors: ['--primary', '--danger', '--scene', '--accent', '--ok', '--paper', '--ink'] },
  { cls: 't-tegel', letter: 'B', name: 'Tegelwerk', display: 'Bungee', body: 'Rubik',
    blurb: 'Delfts blauw op witte tegels, knoppen als emaille bordjes. Strak en vierkant: de humor zit in de deftigheid.',
    colors: ['--accent', '--primary', '--danger', '--ok', '--scene-line', '--paper', '--ink'] },
  { cls: 't-strip', letter: 'C', name: 'Stripboek', display: 'Bangers', body: 'Comic Neue',
    blurb: 'Zwarte inkt, rasterpunten, tekstballonnen en knal-sterren. Elke verstopping is een stripplaatje: het luidst van de drie.',
    colors: ['--primary', '--danger', '--scene', '--ok', '--paper', '--ink'] },
];

const AVATARS = ['duck', 'flamingo', 'elephant', 'ninja', 'crown', 'rocket'];

document.getElementById('directions').innerHTML = DIRECTIONS.map(d => `
<section class="direction ${d.cls}">
  <div class="direction-head">
    <h2>${d.letter} · ${d.name}</h2>
    <p>${d.blurb}</p>
  </div>

  <div class="block">
    <h3>Kleurpalet</h3>
    <div class="swatches">${d.colors.map(c => `<span class="swatch" style="background:var(${c})" title="${c}"></span>`).join('')}</div>
  </div>

  <div class="block">
    <h3>Lettertype</h3>
    <div class="display type-display">Verstopt! Pak de ontstopper</div>
    <div class="type-body">Spoel, ontstop en verzamel 1.250 punten voor een nieuwe emmer. Het gaat vaker mis dan je denkt.</div>
    <div class="type-name">Koppen: ${d.display} · Tekst: ${d.body} (beide SIL Open Font License)</div>
  </div>

  <div class="block">
    <h3>Knoppen en meldingen</h3>
    <div class="scene">
      <button class="btn">Spelen als gast</button>
      <button class="btn round shop" aria-label="Winkel">${I('shopping-cart', 26)}</button>
      <button class="btn round danger" aria-label="Emmer legen">${I('trash-2', 24)}</button>
      <span class="message">${I('triangle-alert', 20)}Verstopt!</span>
      <span class="message good">${I('circle-check', 20)}Ontstopt!</span>
    </div>
  </div>

  <div class="block">
    <h3>Scorebubbel en spoelknop</h3>
    <div class="scene">
      <div class="score">
        <span class="score-top">${I('duck', 26)}<b>1.250</b></span>
        <small>Beste: 3.400</small>
        <span class="pills"><span class="pill">${I('toilet', 12)}×12</span><span class="pill">${I('trophy', 12)}31</span><span class="pill">Lv.3</span></span>
      </div>
      <button class="flush" aria-label="Spoelen">${I('flush', 46)}</button>
    </div>
  </div>

  <div class="block">
    <h3>Gereedschap: onbekend · werkt (afkoelen) · chaos</h3>
    <div class="scene" style="gap:22px; padding-bottom:20px">
      <div class="tool-wrap"><div class="tool unknown">${I('spring', 30)}<span class="badge">?</span></div><div class="tool-label">onbekend</div></div>
      <div class="tool-wrap"><div class="tool working cooling"><svg class="ring" viewBox="0 0 74 74"><circle class="track" cx="37" cy="37" r="32"/><circle class="fill" cx="37" cy="37" r="32"/></svg>${I('plunger', 30)}<span class="badge">${I('check', 14)}</span><span class="secs">8s</span></div><div class="tool-label">werkt</div></div>
      <div class="tool-wrap"><div class="tool chaos">${I('duck', 30)}<span class="badge">${I('zap', 13)}</span></div><div class="tool-label">chaos</div></div>
    </div>
  </div>

  <div class="block">
    <h3>Winkelkaart: te koop (nieuw) · in bezit</h3>
    <div class="scene" style="gap:26px; padding:26px 22px 18px">
      <div class="card"><span class="tag">Nieuw!</span><span class="icon">${I('bucket-metal', 38)}</span><span class="name">Zinken emmer</span><span class="detail">75 liter</span><span class="desc">Voor de serieuze verzamelaar.</span><span class="price">${I('coins', 14)}900</span></div>
      <div class="card owned"><span class="icon">${I('flower-pot', 38)}</span><span class="name">Badkamerplant</span><span class="desc">Zelfs planten overleven hier.</span><span class="price">${I('check', 14)}In bezit</span></div>
    </div>
  </div>

  <div class="block" style="border-bottom:none">
    <h3>Welkomstscherm</h3>
    <div class="scene column">
      <div class="welcome">
        <h4>Welkom bij The Flush Factor</h4>
        <p>Kies een naam en een avatar en begin meteen.</p>
        <div class="identity"><span class="avatar-big">${I('duck', 34)}</span><span class="field">Gast</span></div>
        <div class="avatars">${AVATARS.map((a, i) => `<span class="${i === 0 ? 'on' : ''}">${I(a, 24)}</span>`).join('')}</div>
        <button class="btn">Spelen als gast</button>
        <div class="or">Of log in</div>
        <div class="auth"><span>Inloggen met Google</span><span class="soon">Binnenkort</span></div>
        <div class="auth"><span>Inloggen met Facebook</span><span class="soon">Binnenkort</span></div>
      </div>
    </div>
  </div>
</section>`).join('');
</script>
</body>
</html>
