<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2c7da0">
  <title>The Flush Factor</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

<!-- ══════════════════════════════════════════
     SPELSCHERM
══════════════════════════════════════════ -->
<div id="game-screen" class="screen">

  <!-- Header -->
  <header class="game-header">
    <div class="game-title">🚽 Flush Factor</div>
    <div class="score-block">
      <span id="score-value">0</span>
      <span id="high-score">Beste: 0</span>
    </div>
    <button id="btn-shop" class="btn-header">🛒 Winkel</button>
  </header>

  <!-- Speelgebied -->
  <div class="game-area">

    <!-- Badkamer scène -->
    <div id="bathroom-scene" data-tiles="tiles-default" data-floor="floor-basic">

      <!-- Waterstandbalk links -->
      <div class="water-bar" title="Waterstand">
        <div id="water-bar-fill" class="water-bar-fill water-ok" style="height:0%"></div>
      </div>

      <!-- Statusbericht -->
      <div id="status-msg"></div>

      <!-- Comboweergave -->
      <div id="combo-display"></div>

      <!-- Decoratie-slot (rechts bovenin) -->
      <div id="decoration-slot"></div>

      <!-- Toilet -->
      <div id="toilet-wrapper">
        <svg id="toilet-svg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg"
             role="img" aria-label="Toilet">

          <!-- Schaduw op vloer -->
          <ellipse cx="100" cy="292" rx="60" ry="10" fill="rgba(0,0,0,0.12)"/>

          <!-- Basis / voetstuk -->
          <ellipse class="toilet-porcelain" cx="100" cy="275" rx="52" ry="16" fill="#e8e6d4"/>
          <path    class="toilet-porcelain" d="M48,255 Q48,275 100,280 Q152,275 152,255 L148,230 Q100,224 52,230 Z" fill="#f0eedd"/>

          <!-- Kom (buitenkant) -->
          <ellipse class="toilet-porcelain" cx="100" cy="230" rx="72" ry="48" fill="#f5f4e8"/>

          <!-- Zitring -->
          <ellipse class="toilet-seat" cx="100" cy="216" rx="65" ry="42" fill="#eae8d2"/>

          <!-- Komintereur (dark hole) -->
          <ellipse cx="100" cy="226" rx="50" ry="34" fill="#c8c4a8"/>

          <!-- Water in kom -->
          <ellipse id="bowl-water" cx="100" cy="233" rx="42" ry="28" fill="#5BC8F5"/>

          <!-- Waterglans -->
          <ellipse cx="90" cy="226" rx="14" ry="7" fill="rgba(255,255,255,0.38)"
                   transform="rotate(-15,90,226)" pointer-events="none"/>

          <!-- Verbindingsstuk (tank → kom) -->
          <rect class="toilet-porcelain" x="78" y="120" width="44" height="78" rx="5" fill="#f0eedd"/>

          <!-- Tank lichaam -->
          <rect class="toilet-tank" x="42" y="26" width="116" height="100" rx="8" fill="#f5f4e8"/>

          <!-- Tank deksel -->
          <rect class="toilet-tank-lid" x="36" y="12" width="128" height="20" rx="7" fill="#eae8d2"/>

          <!-- Spoelknop op tank -->
          <rect x="136" y="50" width="28" height="12" rx="5" fill="#c8c7b0"/>
          <rect x="138" y="52" width="24" height="8"  rx="3" fill="#aaa890"/>

          <!-- Water zichtbaar in tank -->
          <rect x="48" y="65" width="104" height="56" rx="4" fill="#b8e8ff" opacity="0.55"/>

          <!-- Tankdetail-lijn -->
          <line x1="48" y1="118" x2="152" y2="118" stroke="#c8c7b0" stroke-width="1.5"
                opacity="0.6" stroke-linecap="round"/>

          <!-- Hendel rechts van tank -->
          <rect x="155" y="58" width="18" height="9" rx="4" fill="#b0af9a"/>
          <line x1="162" y1="58" x2="162" y2="46" stroke="#b0af9a" stroke-width="3"
                stroke-linecap="round"/>
          <circle cx="162" cy="44" r="4" fill="#888878"/>

        </svg>
      </div><!-- /toilet-wrapper -->

    </div><!-- /bathroom-scene -->

    <!-- Spoelknopgebied -->
    <div class="flush-area">
      <button id="flush-btn" aria-label="Spoelen">
        <span>🚿</span>
        <span class="flush-label">SPOELEN</span>
      </button>
    </div>

  </div><!-- /game-area -->

  <!-- Inventarisbalk -->
  <div class="inventory-bar-wrap">
    <div class="inv-label">Gereedschappen</div>
    <div id="inventory-bar"></div>
  </div>

</div><!-- /game-screen -->


<!-- ══════════════════════════════════════════
     WINKELSCHERM
══════════════════════════════════════════ -->
<div id="shop-screen" class="shop-screen" hidden>

  <header class="shop-header">
    <button id="btn-shop-close" class="btn-header">← Terug</button>
    <h2>🛒 Winkel</h2>
    <span id="shop-score">💰 0</span>
  </header>

  <div class="shop-tabs">
    <button class="shop-tab active" data-tab="tools">🔧 Gereedschap</button>
    <button class="shop-tab" data-tab="cosmetics">🎨 Cosmetica</button>
  </div>

  <div id="shop-items"></div>

  <div id="shop-message"></div>

</div><!-- /shop-screen -->


<script type="module" src="js/game.js"></script>
</body>
</html>
