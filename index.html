<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1f2a33">
  <title>The Flush Factor</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/app/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/app/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="js/boot.js"></script>
</head>
<body data-view="toilet">

<div id="game-screen">
  <!-- 3D-scène: het canvas wordt hier door renderer3d.js in gezet en vult het hele scherm -->
  <div id="scene"></div>
  <!-- Effecten over het beeld (confetti, +punten) -->
  <div id="fx-layer" aria-hidden="true"></div>

  <div id="hud">
    <div id="hud-topleft">
      <button id="btn-camera" class="round-btn" aria-label="Camerastand" aria-expanded="false" aria-controls="camera-menu"><svg class="ic" width="24" height="24" aria-hidden="true"><use href="assets/icons/sprite.svg#switch-camera"/></svg></button>
      <div id="camera-menu" class="popover" role="menu" hidden></div>
      <button id="btn-back" class="pill-btn" aria-label="Terug naar het toilet"><svg class="ic" width="20" height="20" aria-hidden="true"><use href="assets/icons/sprite.svg#arrow-left"/></svg><span>Terug</span></button>
    </div>

    <div id="hud-topcenter">
      <button id="btn-menu" class="round-btn" aria-label="Menu" aria-expanded="false" aria-controls="main-menu"><svg class="ic" width="24" height="24" aria-hidden="true"><use href="assets/icons/sprite.svg#menu"/></svg></button>
      <div id="main-menu" class="popover" role="menu" hidden>
        <button class="menu-item" data-action="sound"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="assets/icons/sprite.svg#volume-2"/></svg><span>Geluid</span></button>
        <button class="menu-item" data-action="credits"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="assets/icons/sprite.svg#info"/></svg><span>Credits</span></button>
        <button class="menu-item" data-action="fullscreen"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="assets/icons/sprite.svg#maximize"/></svg><span>Volledig scherm</span></button>
        <button class="menu-item" data-action="camera-reset"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="assets/icons/sprite.svg#eye"/></svg><span>Camera terugzetten</span></button>
      </div>
    </div>

    <div id="hud-topright">
      <div id="score-bubble">
        <span id="score-value">0</span>
        <span id="high-score">Beste: 0</span>
        <div class="streak-row">
          <span id="streak-count" title="Spoelbeurten zonder verstopping"></span>
          <span id="streak-best" title="Langste reeks"></span>
          <span id="level-display" title="Huidig level">Lv.1</span>
        </div>
      </div>
      <button id="btn-shop" class="pill-btn shop-btn"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="assets/icons/sprite.svg#shopping-cart"/></svg><span>Winkel</span></button>
    </div>

    <div id="hud-left">
      <div class="water-bar" title="Waterstand"><div id="water-bar-fill"></div></div>
      <div id="inventory-bar"></div>
    </div>

    <div id="hud-bottom">
      <div id="combo-display"></div>
      <button id="flush-btn" aria-label="Spoelen"><svg class="ic" width="44" height="44" aria-hidden="true"><use href="assets/icons/sprite.svg#flush"/></svg></button>
    </div>

    <div id="hud-bottomright">
      <span id="bucket-liters">0,0 / 20 L</span>
      <button id="btn-bucket" class="round-btn bucket-btn" aria-label="Emmer bekijken"></button>
      <button id="btn-bucket-empty" class="pill-btn danger" aria-label="Emmer legen" hidden><svg class="ic" width="16" height="16" aria-hidden="true"><use href="assets/icons/sprite.svg#trash-2"/></svg><span>Legen</span></button>
    </div>

    <div id="status-msg" role="status"></div>
    <div id="clog-warning" aria-hidden="true"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="assets/icons/sprite.svg#triangle-alert"/></svg><span>VERSTOPT!</span></div>
    <div id="unclog-banner" aria-hidden="true"></div>
    <div id="levelup-banner" aria-hidden="true"></div>
  </div>

  <div id="loading"><div class="spinner"></div><span>Laden…</span></div>
</div>

<!-- Winkel -->
<div id="shop-screen" hidden>
  <header class="shop-header">
    <button id="btn-shop-close" class="pill-btn shop-btn" aria-label="Terug naar het spel"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="assets/icons/sprite.svg#arrow-left"/></svg><span>Terug</span></button>
    <h2>Winkel</h2>
    <span id="shop-score"></span>
  </header>
  <div id="shop-items"></div>
  <div id="shop-message" role="status"></div>
</div>

<!-- Credits -->
<div id="credits-modal" role="dialog" aria-label="Credits" hidden>
  <div id="credits-content">
    <button id="btn-credits-close" class="round-btn" aria-label="Sluiten"><svg class="ic" width="20" height="20" aria-hidden="true"><use href="assets/icons/sprite.svg#x"/></svg></button>
    <h2>The Flush Factor</h2>
    <div id="credits-list"></div>
  </div>
</div>

<!-- Melding als het spel niet kan starten (geen WebGL of laadfout) -->
<div id="fatal" role="alert" hidden>
  <svg class="ic" width="44" height="44" aria-hidden="true"><use href="assets/icons/sprite.svg#triangle-alert"/></svg>
  <h2 id="fatal-title"></h2>
  <p id="fatal-body"></p>
</div>

<script type="importmap">{ "imports": { "three": "./js/vendor/three.module.min.js" } }</script>
<script src="js/phone-preview.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
